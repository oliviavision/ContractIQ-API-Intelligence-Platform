# PostgreSQL connection settings are loaded from backend/.env.
# Development and test use separate databases to prevent accidental data loss.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", "5432") %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "contractiq_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DB_NAME", "contractiq_test") %>

production:
  primary: &primary_production
    <<: *default
    database: <%= ENV.fetch("DB_NAME_PRODUCTION", "contractiq_production") %>
  cache:
    <<: *primary_production
    database: <%= ENV.fetch("DB_NAME_PRODUCTION", "contractiq_production") %>_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: <%= ENV.fetch("DB_NAME_PRODUCTION", "contractiq_production") %>_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: <%= ENV.fetch("DB_NAME_PRODUCTION", "contractiq_production") %>_cable
    migrations_paths: db/cable_migrate
